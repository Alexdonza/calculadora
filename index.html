<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Calculadora | AC + Borrar ←</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator">
         <h1 >Alex Doroteo</h1>
        <div class="display">
        
            <div class="previous-operand" id="previousOperand"></div>
            <div class="current-operand" id="currentOperand">0</div>
        </div>
        <div class="buttons">
            <!-- Fila 1: AC, ←, %, ÷ -->
            <button class="btn-ac" data-action="clear">AC</button>
            <button class="btn-delete" data-action="delete">←</button>
            <button class="btn-operator" data-op="percent">%</button>
            <button class="btn-operator" data-op="divide">÷</button>

            <!-- Fila 2: 7, 8, 9, × -->
            <button class="btn-number" data-number="7">7</button>
            <button class="btn-number" data-number="8">8</button>
            <button class="btn-number" data-number="9">9</button>
            <button class="btn-operator" data-op="multiply">×</button>

            <!-- Fila 3: 4, 5, 6, - -->
            <button class="btn-number" data-number="4">4</button>
            <button class="btn-number" data-number="5">5</button>
            <button class="btn-number" data-number="6">6</button>
            <button class="btn-operator" data-op="subtract">-</button>

            <!-- Fila 4: 1, 2, 3, + -->
            <button class="btn-number" data-number="1">1</button>
            <button class="btn-number" data-number="2">2</button>
            <button class="btn-number" data-number="3">3</button>
            <button class="btn-operator" data-op="add">+</button>

            <!-- Fila 5: 0, ., = -->
            <button class="btn-number" data-number="0" style="grid-column: span 2;">0</button>
            <button class="btn-number btn-dot" data-number=".">.</button>
            <button class="btn-equals" data-action="equals">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
